server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads pass through here on their way to the API. The default is 1MB, which
    # would reject every screen recording with an nginx error page the application
    # never sees and cannot explain.
    client_max_body_size 200m;

    # Long enough for a large upload on a slow connection to finish. The default 60s
    # cuts off a 100MB file over anything less than a good office line.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API, same-origin. This is why the image defaults VITE_API_BASE_URL to a
    # relative path: proxying here means no CORS preflight on every request, and no
    # second hostname to configure, certificate and keep in the allowlist.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Read by the API's forwarded-headers middleware. Without them every audit row
        # records this container's address instead of the person's, and the sign-in
        # rate limiter treats the whole organization as one client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR. The upgrade headers are what turn this into a WebSocket rather than a
    # long poll that times out at the proxy.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A hub connection is idle between messages by design; the default read
        # timeout would drop it and the client would reconnect every minute.
        proxy_read_timeout 3600s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        access_log off;
    }

    # Hashed asset filenames change whenever their contents do, so they can be cached
    # indefinitely without ever serving a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the single-page application. index.html itself is never
    # cached — it is the file that names the current asset hashes, and a cached copy
    # points a returning visitor at files that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
